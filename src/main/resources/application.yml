spring:
  config:
    activate:
      on-profile: test
  datasource:
    driverClassName: org.postgresql.Driver
    password: ${LOCAL_PG_PASSWORD}
    url: jdbc:postgresql://localhost:5432/postraves
    username: mmazurovsky
#  r2dbc:
#    url: r2dbc:postgresql://localhost:5432/postraves
#    protocol: r2dbc
#    username: mmazurovsky
#    password:  ${LOCAL_PG_PASSWORD}
  flyway:
    locations: classpath:/db/migration/postgres
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}
    schemas: public
    baseline-on-migrate: true
  redis:
    host: localhost
    port: 6379
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  logging:
    level:
      org:
        flywaydb: debug
        springframework: debug
