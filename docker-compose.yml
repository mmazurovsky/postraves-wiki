version: '3.4'
services:
  flyway:
    image: 'flyway/flyway:latest'
    env_file:
      - ${ROOT_APP_ENV_LOCATION}
    command: -url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB} -schemas=public -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    volumes:
      - ./app/src/main/resources/db/migration/postgres:/flyway/sql
  nginx:
    image: nginx:latest
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - flyway
  api:
    image: ${WIKI_API_IMAGE}:latest
    hostname: api
    env_file:
      - ${ROOT_APP_ENV_LOCATION}
    depends_on:
      - flyway
