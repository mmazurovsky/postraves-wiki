version: '3.4'
services:
  flyway:
    image: 'flyway/flyway:latest'
    env_file:
      - .env
    command: -url=jdbc:postgresql://postgres:5432/postraves -schemas=public -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    volumes:
      - ./app/src/main/resources/db/migration/postgres:/flyway/sql
    depends_on:
      - postgres
  postgres:
    image: 'postgres:latest'
    env_file:
      - .env
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "${POSTGRES_USER}", "-d", "postraves" ]
      interval: 5s
      timeout: 1s
      retries: 2
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
  nginx:
    restart: always
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - '80:80'
    depends_on:
      - api
  api:
    container_name:
      api_container
    build:
      context: ./app
      dockerfile: Dockerfile
      target: final
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
